<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cartinhas 💌</title>

<style>

*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body{
    font-family: 'Arial', sans-serif;
    background: linear-gradient(135deg, #ffd6e7, #ffeef5);
    text-align: center;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.caixa{
    background: rgba(255,255,255,0.95);
    width: 380px;
    max-width: 100%;
    padding: 30px;
    border-radius: 25px;
    box-shadow: 0 10px 30px rgba(255,105,180,0.3);
    animation: aparecer 0.8s ease;
}

@keyframes aparecer{
    from{
        opacity: 0;
        transform: translateY(20px);
    }

    to{
        opacity: 1;
        transform: translateY(0);
    }
}

h1{
    color: #ff4f93;
    margin-bottom: 15px;
    font-size: 32px;
}

p{
    color: #555;
    margin-bottom: 15px;
}

input{
    padding: 12px;
    width: 85%;
    border: 2px solid #ffc1d6;
    border-radius: 15px;
    outline: none;
    font-size: 16px;
    transition: 0.3s;
}

input:focus{
    border-color: #ff69b4;
    box-shadow: 0 0 10px rgba(255,105,180,0.3);
}

button{
    padding: 12px 22px;
    margin-top: 15px;
    border: none;
    background: linear-gradient(135deg, #ff69b4, #ff4f93);
    color: white;
    border-radius: 15px;
    cursor: pointer;
    font-size: 15px;
    transition: 0.3s;
    box-shadow: 0 5px 15px rgba(255,105,180,0.3);
}

button:hover{
    transform: scale(1.05);
    background: linear-gradient(135deg, #ff4f93, #ff1493);
}

#opcoes{
    display: none;
    margin-top: 25px;
}

#opcoes button{
    margin: 10px;
}

#mensagem{
    margin-top: 25px;
    font-size: 17px;
    color: #444;
    line-height: 1.7;
    background: #fff5fa;
    padding: 15px;
    border-radius: 15px;
    animation: fade 0.5s ease;
}

@keyframes fade{
    from{
        opacity: 0;
    }

    to{
        opacity: 1;
    }
}

.emoji{
    font-size: 40px;
    margin-bottom: 10px;
}

/* VÍDEO DA TATINHA */

#videoTatinha{
    display: none;
    width: 100%;
    max-width: 320px;
    margin: 20px auto 0;
    border-radius: 18px;
    box-shadow: 0 8px 20px rgba(255,105,180,0.25);
    background: #000;
}

</style>
</head>

<body>

<div class="caixa">

    <div class="emoji">💌🌸</div>

    <h1>Olá 💖</h1>

    <p>Digite sua data de nascimento:</p>

    <input 
        type="text" 
        id="data" 
        placeholder="Ex: 13/05"
    >

    <br>

    <button onclick="verificar()">
        Entrar ✨
    </button>

    <div id="opcoes">

        <h3 style="margin-top:20px; color:#ff4f93;">
            Escolha uma opção 💕
        </h3>

        <button onclick="mostrarMensagem(1)">
            🌷 Dia das Mães
        </button>

        <button onclick="mostrarMensagem(2)">
            🎂 Seu aniversário
        </button>

    </div>

    <div id="mensagem"></div>

    <!-- VÍDEO DA TATINHA -->
   <video id="videoTatinha"
       controls
       playsinline
       preload="metadata"
       style="display:none; width:100%; max-width:320px; margin:20px auto 0; border-radius:18px;">
    
    <source src="videos/tatinha.mp4" type="video/mp4">

    Seu navegador não suporta vídeo.
</video>

</div>

<script>

let usuario = "";

function esconderVideo(){

    let video = document.getElementById("videoTatinha");

    video.style.display = "none";

    video.pause();
    video.currentTime = 0;
}


function verificar(){

    let data = document.getElementById("data").value.trim();

    // Esconde o vídeo sempre que fizer um novo login
    esconderVideo();


    if(data == "1203" || data == "12/03"){

        usuario = "tia";

        document.getElementById("opcoes").style.display = "block";

        document.getElementById("mensagem").innerHTML =
        "Acesso liberado 💖";

    }

    else if(data == "1612" || data == "16/12"){

        usuario = "mae";

        document.getElementById("opcoes").style.display = "block";

        document.getElementById("mensagem").innerHTML =
        "Acesso liberado 💖";

    }

    else if(data == "1208" || data == "12/08"){

        usuario = "tatinha";

        document.getElementById("opcoes").style.display = "block";

        document.getElementById("mensagem").innerHTML =
        "Acesso liberado 💖";

    }

    else if(data == "2303" || data == "23/03"){

        usuario = "tatao";

        document.getElementById("opcoes").style.display = "block";

        document.getElementById("mensagem").innerHTML =
        "Acesso liberado 💖";

    }

    else{

        usuario = "";

        document.getElementById("mensagem").innerHTML =
        "❌ Data inválida";

        document.getElementById("opcoes").style.display = "none";

    }
}


function mostrarMensagem(opcao){

    // Esconde o vídeo quando troca de mensagem
    esconderVideo();


    /* =========================
       DIA DAS MÃES
    ========================= */

    if(opcao == 1){

        if(usuario == "tia"){

            document.getElementById("mensagem").innerHTML =

            "Feliz Dia das Mães, tia. Eu queria agradecer por tudo o que você fez por mim. Quando a minha mãe trabalhava à noite, quem cuidava de mim era você. Então, você é como uma segunda mãe para mim. Muito obrigado por tudo, tia. Eu te amo muito ❤️";

        }


        else if(usuario == "tatao"){

            document.getElementById("mensagem").innerHTML =

            "Feliz Dia das Mães, Tatao 🤍<br><br>" +

            "Eu não sou seu filho, mas dá para ver o quanto você é esforçada como mãe e o quanto ama o Luis. Que ele cresça sabendo como você é uma mãe incrível.<br><br>" +

            "Nunca desanime por causa dos outros. Como a nossa mãe disse: “Você brilha muito, e isso incomoda os outros.” Continue lutando e sendo essa pessoa forte que você é.<br><br>" +

            "Te amo, Tatao 🤍🤍";

        }


        else if(usuario == "mae"){

            document.getElementById("mensagem").innerHTML =

            "🌷 Feliz Dia das Mães!<br><br>" +

            "Do: Caçula <br><br>"+

            "Eu quero que você saiba que eu te amo muito. " +

            "Eu sei que não sou o melhor filho do mundo, " +

            "mas eu prometo que um dia vou te dar tudo o que você merece… " +

            "ou melhor, quase tudo, porque o que você merece é o mundo 💖<br><br>" +

            "Tem muitas coisas que eu queria falar, mas eu sou ruim com as palavras. " +

            "Então eu só quero agradecer por tudo o que a mãe fez por mim e pelas minhas irmãs. " +

            "Somente Deus sabe como foi a sua trajetória até aqui ✨<br><br>" +

            "E eu espero que você não fique brava por eu não dar presente 😅 " +

            "É que eu tô juntando dinheiro pra tatuagem kkk. <br><br>" +

            "De: Franzinha sua filha do meio!<br><br> " +

            "Mãe, feliz Dia das Mães ❤️<br><br>" +

            "Eu nunca vou conseguir colocar em palavras tudo o que você representa pra mim, porque seu amor aparece em cada cuidado, cada conselho, cada abraço e em todas as vezes que você esteve ao meu lado mesmo quando ninguém mais estava.<br><br>" +

            "Você é meu porto seguro, minha força e uma das pessoas que eu mais admiro na vida. Sou muito grata por tudo o que você faz por mim, pelos sacrifícios que muitas vezes eu nem vejo e pelo amor imenso que você me dá todos os dias.<br><br>" +

            "Espero um dia conseguir retribuir pelo menos um pedacinho de tudo o que você merece. Eu te amo mais do que consigo explicar. Obrigada por ser minha mãe, minha proteção e meu lar 💖<br><br>" +

            "Da: irma mais velha<br><br>" +

            "Mãe, sua força, coragem e determinação sempre serão minha maior inspiração. Você é uma mulher guerreira, que enfrenta cada desafio com fé e amor no coração. Sou grata por ter você como exemplo de vida. Feliz Dia das Mães para a mulher mais forte e especial que eu conheço! ❤️🌷";

        }


        else if(usuario == "tatinha"){

            document.getElementById("mensagem").innerHTML =

            "Eu sei que você não é mãe, mas você é mãe de pet kkk, e também cuidou de mim como uma mãe quando eu era pequeno.<br><br>" +

            "Queria te agradecer por muitas coisas. Você me ensinou muita coisa e também proporcionou muitos momentos incríveis pra mim. Você lembra do piquenique no telhado? Kkkk.<br><br>" +

            "A maioria das coisas que eu gosto foi você que me apresentou, como músicas. Por sua causa eu tenho bom gosto kkk.<br><br>" +

            "E por isso eu queria agradecer por tudo o que você fez por mim e por ainda me ajudar em muitas coisas até hoje. Por conta disso, eu tenho certeza de que você vai ser uma ótima mãe.<br><br>" +

            "Te amo, Tata 🤍🤍<br><br>" +

            "E Feliz Dia das Mães 💐";



        }

    }


    /* =========================
       ANIVERSÁRIO
    ========================= */

    else if(opcao == 2){

        if(usuario == "tia"){

            document.getElementById("mensagem").innerHTML =

            "Feliz aniversário atrasado, tia. Como eu não te dei um presente, gostaria que você aceitasse esse mini texto kk.<br><br>" +

            "Eu não tenho muito a falar, mas gostaria que você soubesse que você é muito especial para mim. E quero que saiba que nós somos sua família e sempre vamos estar aqui quando você precisar ❤️<br><br>";

        }


        else if(usuario == "tatao"){

            document.getElementById("mensagem").innerHTML =

            "Eu gostaria de falar “feliz aniversário atrasado” kkk. Como eu não dei presente, gostaria que você aceitasse esse texto.<br><br>" +

            "Não tenho muito o que falar, porque eu sempre digo que você é incrível, mas dessa vez eu gostaria de lembrar que você não está sozinha. Você é forte, mas não precisa carregar todo o fardo sozinha. E se você fraquejar ou cair, não se preocupe, isso não é motivo para se humilhar, mas sim para perceber que sozinha é difícil. Por isso você tem sua família e Deus.<br><br>" +

            "Nunca fique pensando que você não pode. Te amo, Tata ❤️";

        }


        else if(usuario == "mae"){

            document.getElementById("mensagem").innerHTML =

            "🎂 Ainda não é o seu aniversário kkk 💕";

        }


        else if(usuario == "tatinha"){

            document.getElementById("mensagem").innerHTML =

            "Da: MÃE <br><br>" +
            "Parabéns  filha  vc e minha  pequena  sabe  filha  vc e muito importante   filha  eu olho para vc e vejo  que não  e mais  aquela  pequenina   que eu carregue  no colo  com tanto  amor  hj olha  e vejo  uma  mulher  linda  e maravilhosa  pessoa  forte  💪  e corajosa   e que nada ti abala destemida  e destemida  que luta por seu enterese    carinhosa ❤️  e muito  forte   com uma fé inabalável   tenho  muito  orgulho de  vc minha  bonequinha  ti amo ❤️  muito  até o infinito   e além ❣️❣️❤️💋💋💋" +
            "Da: Irmã mais Velha<br><br>" +
            "Feliz aniversário, minha irmã guerreira! Sua força é minha grande inspiração. Sei que todos os que te conhecem admiram a sua coragem e determinação. Quando você decide fazer algo, ninguém te tira do foco! Parabéns por ser exatamente como é." +
            "Tenho muito orgulho de você! Desejo que o seu novo ano seja repleto de conquistas, paz e felicidade. Você merece o mundo! Que nunca faltem motivos para sorrir e que cada desafio te aproxime sempre mais do seu sucesso. Te amo demais!" +
            "Do: Caçula" +
            "Oi, Tata! Feliz aniversário! Kkkkk. Esqueci de falar hoje porque a minha memória não é muito boa para guardar datas, mas isso é óbvio. Tirando essa parte, eu sou bem lembrado das coisas kkkkk. Como aquelas vezes que você me batia quando eu era pequeno… não vai achando que eu esqueci, hein? Mas eu acho que era para o meu bem, eu espero kkkkk." +
            "Também lembro quando nós brincamos na chuva. Se você não lembrar, vai ter um negócio aí embaixo para refrescar a sua memória. Mas eu também queria falar que admiro muito você, como pessoa e como futura enfermeira, e me inspiro muito em você, em como você é esforçada e em como consegue o que quer sempre." +
            "Eu poderia ficar horas aqui digitando e falando de você, mas já estou começando a ficar cansado kkkkk. Te amo muito, Tata! Que Deus abençoe a sua vida! ❤️" +
                "E agora escrevendo isso vi como eu e você crescemos e obviamwnte eu cresci mais kk";
            
             // MOSTRA O VÍDEO DA TATINHA
            let video = document.getElementById("videoTatinha");

            video.style.display = "block";

            video.load();

        }

    }

}

</script>

</body>
</html>
