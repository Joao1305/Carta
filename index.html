<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cartinhas 💌</title>

<style>

*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body{
    font-family: 'Arial', sans-serif;
    background: linear-gradient(135deg, #ffd6e7, #ffeef5);
    text-align: center;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.caixa{
    background: rgba(255,255,255,0.95);
    width: 380px;
    padding: 30px;
    border-radius: 25px;
    box-shadow: 0 10px 30px rgba(255,105,180,0.3);
    animation: aparecer 0.8s ease;
}

@keyframes aparecer{
    from{
        opacity: 0;
        transform: translateY(20px);
    }

    to{
        opacity: 1;
        transform: translateY(0);
    }
}

h1{
    color: #ff4f93;
    margin-bottom: 15px;
    font-size: 32px;
}

p{
    color: #555;
    margin-bottom: 15px;
}

input{
    padding: 12px;
    width: 85%;
    border: 2px solid #ffc1d6;
    border-radius: 15px;
    outline: none;
    font-size: 16px;
    transition: 0.3s;
}

input:focus{
    border-color: #ff69b4;
    box-shadow: 0 0 10px rgba(255,105,180,0.3);
}

button{
    padding: 12px 22px;
    margin-top: 15px;
    border: none;
    background: linear-gradient(135deg, #ff69b4, #ff4f93);
    color: white;
    border-radius: 15px;
    cursor: pointer;
    font-size: 15px;
    transition: 0.3s;
    box-shadow: 0 5px 15px rgba(255,105,180,0.3);
}

button:hover{
    transform: scale(1.05);
    background: linear-gradient(135deg, #ff4f93, #ff1493);
}

#opcoes{
    display: none;
    margin-top: 25px;
}

#opcoes button{
    margin: 10px;
}

#mensagem{
    margin-top: 25px;
    font-size: 17px;
    color: #444;
    line-height: 1.7;
    background: #fff5fa;
    padding: 15px;
    border-radius: 15px;
    animation: fade 0.5s ease;
}

@keyframes fade{
    from{
        opacity: 0;
    }

    to{
        opacity: 1;
    }
}

.emoji{
    font-size: 40px;
    margin-bottom: 10px;
}

</style>
</head>

<body>

<div class="caixa">

<div class="emoji">💌🌸</div>

</div>

</div>

</body>
</html>
